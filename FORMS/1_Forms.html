<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/1_basicStyles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.css"
    />
  </head>
  <body>
    <form>
      <div>
        <label for="name">Name</label>
        <input id="name" type="text" />
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" />
      </div>
      <button type="submit">Register</button>
      <button type="reset">Clear</button>
    </form>
    <form>
      <input type="text" />
      <input type="number" />
      <input type="password" />
      <input type="date" />
      <input type="email" />
      <textarea>text</textarea>
      <input type="text" value="moni@gmail.com" />
      <input type="text" placeholder="email" />
      <input type="text" readonly value="......." />
      <input type="text" disabled />
      <input type="email" maxlength="5" placeholder="solo 5 letras" />
      <input type="email" autofocus />
      <!-- para logins -->
      <textarea>El value va dentro de las etiquetas.</textarea>
    </form>
    <!--Sugerencias: -->
    <form>
      <input type="text" list="countries" autocomplete="off" />
      <datalist id="countries">
        <option data-value="1">Australia</option>
        <!--el id para el servidor-->
        <option>Canada</option>
        <option>India</option>
        <option>United</option>
      </datalist>
    </form>
    <form>
      <select>
        <optgroup label="Front-end Courses">
          <option value="">Select a course...</option>
          <option value="1">HTML</option>
          <option value="2">CSS</option>
          <option value="3">JAVAS</option>
        </optgroup>
        <optgroup label="Back-end Courses">
          <option value="">Select a course...</option>
          <option value="1">Node</option>
          <option value="2">ASP</option>
          <option value="3">Django</option>
        </optgroup>
      </select>
    </form>
    <form >
        <div>
            <input type="checkbox" id="front-end" disabled>
            <label class="label-inline" for="front-end">Front-end</label>
        </div> <!--esa clase está en la documentación de milligram-->
        <div>
            <input type="checkbox" id="back-end" checked>
            <label class="label-inline" for="back-end">Back-end</label>
        </div> 
    </form>
    <form >
        <div>
            <input type="radio" name="membership" id="silver">
            <label for="silver" class="label-inline">Silver</label>
        </div>
        <div>
            <input type="radio" name="membership" id="gold">
            <label for="gold" class="label-inline">Gold</label>
        </div>
    </form>
    <form>
        <input type="range" min="0" max="100" value="90">
    </form>
    <form >
        <input type="file" multiple>
        <input type="file" accept=".jpg, .png">
        <input type="file" accept="image/*">
        <input type="file" accept="video/*">
        <input type="file" accept="audio/*">
    </form>
    <form >
        <fieldset>
            <legend>Billing Adress</legend>
            <input type="text">
            <input type="text">
            <input type="text">
        </fieldset>
        <fieldset>
            <legend>Payment</legend>
            <input type="text">
            <input type="text">
            <input type="text">
        </fieldset>
    </form>
  </body>
</html>
