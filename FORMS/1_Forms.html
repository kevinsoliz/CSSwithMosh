<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/1_basicStyles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.css"
    />
  </head>
  <body>
    <form>
      <div>
        <label for="name">Name</label>
        <input id="name" type="text" />
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" />
      </div>
      <button type="submit">Register</button>
      <button type="reset">Clear</button>
    </form>
    <form>
      <input type="text" />
      <input type="number" />
      <input type="password" />
      <input type="date" />
      <input type="email" />
      <textarea >text</textarea>
      <input type="text" value="moni@gmail.com">
      <input type="text" placeholder="email">
      <input type="text" readonly value=".......">
      <input type="text" disabled>
      <input type="email" maxlength="5" placeholder="solo 5 letras">
      <input type="email" autofocus> <!-- para logins -->
      <textarea>El value va dentro de las etiquetas.</textarea>
    </form>
    <!--Sugerencias: -->
    <form >
        <input type="text" list="countries" autocomplete="off">
        <datalist id="countries">
            <option data-value="1">Australia</option> <!--el id para el servidor-->
            <option>Canada</option>
            <option>India</option>
            <option>United</option>
        </datalist>
    </form>
  </body>
</html>
